<svg class="lg" viewBox="0 0 512 512" role="img" aria-label="IPNET Events" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
<style>.lg{overflow:visible}.lg *{transform-box:fill-box;transform-origin:center}
.lg-perf{stroke-dasharray:4 16}.lg-tw{opacity:0}.lg-glow{opacity:.5}.lg-shine{transform:skewX(-20deg)}
@media (prefers-reduced-motion:no-preference){
.lg-tilt{animation:lgTilt 6s ease-in-out infinite}
@keyframes lgTilt{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-8px)}}
.lg-spark{animation:lgSpark 3.2s ease-in-out infinite}
@keyframes lgSpark{0%{transform:rotate(0) scale(1)}50%{transform:rotate(45deg) scale(1.28)}100%{transform:rotate(90deg) scale(1)}}
.lg-shine{animation:lgShine 3.6s ease-in-out infinite}
@keyframes lgShine{0%,50%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(440px) skewX(-20deg)}}
.lg-perf{animation:lgPerf 1.1s linear infinite}
@keyframes lgPerf{to{stroke-dashoffset:-20}}
.lg-glow{animation:lgGlow 3s ease-in-out infinite}
@keyframes lgGlow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.12)}}
.lg-tw{animation:lgTw 2.6s ease-in-out infinite}
@keyframes lgTw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
}</style><defs><linearGradient id="lgg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3dc"/><stop offset=".5" style="stop-color:var(--c,#f796cb)"/><stop offset="1" stop-color="#8b6bff"/></linearGradient>
