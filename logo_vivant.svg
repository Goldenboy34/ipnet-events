<ellipse class="lg-glow" cx="256" cy="256" rx="200" ry="140" style="fill:var(--c,#f796cb)" filter="url(#lgf1)"/>
<g class="lg-tilt"><path fill="url(#lgg1)" d="M96 130H416a32 32 0 0 1 32 32V226a30 30 0 0 0 0 60V350a32 32 0 0 1-32 32H96a32 32 0 0 1-32-32V286a30 30 0 0 0 0-60V162a32 32 0 0 1 32-32Z"/>
<g clip-path="url(#lgc1)"><rect class="lg-shine" x="30" y="110" width="70" height="290" fill="#fff" opacity=".38"/></g>
